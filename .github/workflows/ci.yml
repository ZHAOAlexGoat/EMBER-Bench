name: Validate website and evaluation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install evaluation and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Validate website and paper results
        run: python scripts/validate_site.py
      - name: Run offline evaluation tests
        run: python -m pytest evaluation/tests tests -q
      - name: Exercise public CLI and local API transports
        run: ember-bench api-test --out runs/ci-smoke
