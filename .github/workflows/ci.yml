name: Validate website and evaluation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12']
        include:
          - os: ubuntu-latest
            python: '3.10'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install evaluation and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Validate website and paper results
        run: python scripts/validate_site.py
      - name: Run offline evaluation tests
        run: python -m pytest evaluation/tests tests -q
      - name: Exercise public CLI and local API transports
        run: python -m ember_bench api-test --out "runs/ci smoke"
      - name: Download and validate a public question without credentials
        env:
          HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
        run: |
          python -m ember_bench download --levels L1 --tasks P --limit 1 --data-root "runs/public data"
          python -m ember_bench validate --levels L1 --tasks P --limit 1 --data-root "runs/public data"
